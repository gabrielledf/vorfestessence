# Blueprint opcional para o Render.com.
# Permite criar o Web Service automaticamente ao conectar o repositório.
services:
  - type: web
    name: vorfest-whatsapp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    # Disco persistente para não perder o login do WhatsApp a cada deploy.
    # Obs.: discos não estão disponíveis no plano free — considere o plano Starter
    # se quiser evitar reautenticar (escanear o QR) após reinícios.
    disk:
      name: wa-auth
      mountPath: /app/auth_state
      sizeGB: 1
    envVars:
      - key: WHATSAPP_SERVICE_TOKEN
        sync: false
      - key: EVENT_NAME
        value: Vorfest Essence
      - key: EVENT_VENUE
        value: Restaurante Essence
      - key: EVENT_DATE
        value: Sábado, 27 de Setembro de 2026
      - key: AUTH_DIR
        value: /app/auth_state
